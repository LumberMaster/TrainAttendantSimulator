<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Game Platform</title>
<link rel="stylesheet" href="css/styles.css">
<style>
  /* --- компактный layout: игра слева, лидерборд справа --- */
  #screen-game.active{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
  .game-layout{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:10px;padding:10px;min-height:0}
  .game-col,.lb-col{display:flex;flex-direction:column;min-height:0;gap:8px}
  #game-stage{position:relative;flex:1;min-height:0;background:#000;border-radius:8px;overflow:hidden}
  #unity-canvas{width:100%;height:100%;display:block}
  .stage-overlay{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:12px;padding:16px;overflow:auto;background:#0d1117}
  .lb-col{background:#141821;border-radius:8px;padding:8px}
  .lb-head{display:flex;align-items:center;gap:8px;flex:none}
  .lb-head select{flex:1;min-width:0}
  #lb-content{flex:1;min-height:0;overflow:auto}
  @media(max-width:820px){
    .game-layout{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;overflow:auto}
    #game-stage{min-height:45vh}
    #lb-content{max-height:40vh}
  }
</style>
</head>
<body>

<!-- ================= AUTH ================= -->
<section id="screen-auth" class="screen active">
  <div class="auth-card">
    <h1>Game Platform</h1>
    <div class="sub">Войдите или создайте аккаунт</div>

    <div class="tabs" role="tablist">
      <button id="tab-login" class="active" type="button">Вход</button>
      <button id="tab-register" type="button">Регистрация</button>
    </div>

    <form id="form-login" autocomplete="on">
      <div class="field">
        <label for="login-email">Email</label>
        <input id="login-email" type="email" required autocomplete="email" placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="login-pass">Пароль</label>
        <input id="login-pass" type="password" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <div class="form-error" id="login-err"></div>
      <button type="submit" style="width:100%" id="login-submit">Войти</button>
    </form>

    <form id="form-register" autocomplete="on" style="display:none">
      <div class="field">
        <label for="reg-email">Email</label>
        <input id="reg-email" type="email" required autocomplete="email" placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="reg-pass">Пароль</label>
        <input id="reg-pass" type="password" required minlength="1" autocomplete="new-password" placeholder="••••••••">
      </div>
      <div class="field">
        <label for="reg-first">Имя</label>
        <input id="reg-first" type="text" required placeholder="Иван">
      </div>
      <div class="field">
        <label for="reg-second">Фамилия</label>
        <input id="reg-second" type="text" required placeholder="Иванов">
      </div>
      <div class="field">
        <label for="reg-third">Отчество <span style="opacity:.5">(необязательно)</span></label>
        <input id="reg-third" type="text" placeholder="Иванович">
      </div>
      <div class="form-error" id="register-err"></div>
      <button type="submit" style="width:100%" id="register-submit">Создать аккаунт</button>
    </form>

    <div class="hint">Данные хранятся на сервере платформы</div>
  </div>
</section>

<!-- ================= GAME + LEADERBOARD ================= -->
<section id="screen-game" class="screen">
  <header class="topbar">
    <div class="logo" style="font-size:16px">🎮 Game Platform</div>
    <div class="spacer"></div>
    <div>Сценарий: <b id="hud-scenario">—</b></div>
    <div>Время: <b id="hud-timer">00:00</b></div>
    <button class="ghost" id="game-back" type="button">Сменить сценарий</button>
    <div class="user" id="user-info"></div>
    <button class="ghost" id="btn-logout" type="button">Выйти</button>
  </header>

  <div class="game-layout">

    <!-- ---- игровой блок ---- -->
    <div class="game-col">
      <div id="game-stage">
        <!-- 1) выбор/загрузка сценария (до загрузки игры) -->
        <div id="game-start" class="stage-overlay">
          <h2 class="section-title" style="margin:0">Выберите сценарий</h2>
          <div id="scenarios-grid" class="grid"></div>
          <div id="scenarios-empty" class="empty" style="display:none">Сценариев пока нет</div>
        </div>

        <!-- 2) загрузка движка -->
        <div id="unity-loading" class="stage-overlay" style="display:none">
          <div>Загрузка движка…</div>
          <div class="bar"><i id="unity-progress"></i></div>
          <div id="unity-progress-text" style="font-size:12px;opacity:.6">0%</div>
        </div>

        <canvas id="unity-canvas" tabindex="-1"></canvas>
      </div>
    </div>

    <!-- ---- лидерборд с фильтром по сценарию ---- -->
    <aside class="lb-col">
      <div class="lb-head">
        <div class="logo" id="lb-title" style="font-size:15px">Рейтинг</div>
        <select id="lb-scenario-filter" aria-label="Фильтр по сценарию">
          <option value="">Все сценарии</option>
        </select>
      </div>
      <div id="lb-content"></div>
    </aside>

  </div>
</section>

<div id="toast"></div>

<!-- Unity loader (плейсхолдеры Unity) -->
<script src="Build/{{{ LOADER_FILENAME }}}"></script>

<!--
  Unity build config.
  ВАЖНО: этот блок ОБЯЗАН остаться внутри index.html — Unity заменяет
  плейсхолдеры и обрабатывает условные директивы шаблона (memory/symbols),
  поэтому в отдельный .js-файл его выносить нельзя.
-->
<script>
window.UNITY_BUILD = {
  dataUrl:      "Build/{{{ DATA_FILENAME }}}",
  frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
  codeUrl:      "Build/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
  memoryUrl:    "Build/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
  symbolsUrl:   "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
  streamingAssetsUrl: "StreamingAssets",
  companyName:    "{{{ COMPANY_NAME }}}",
  productName:    "{{{ PRODUCT_NAME }}}",
  productVersion: "{{{ PRODUCT_VERSION }}}"
};
</script>

<script type="module" src="js/main.js"></script>
</body>
</html>
